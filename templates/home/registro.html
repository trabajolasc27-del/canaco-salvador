{% extends "partials/base.html" %}

{% block title %}Crear cuenta | CANACO Tabasco{% endblock %}

{% block content %}
<section class="seccion formulario-seccion">
    <div class="tarjeta-formulario tarjeta-formulario-amplia">
        <span class="subtitulo">Nuevo usuario</span>
        <h1>Crear una cuenta</h1>

        <p>Completa los datos para registrarte en el portal.</p>

        <form class="formulario" method="post">
            {% csrf_token %}

            <div class="rejilla-formulario">
                <div>
                    <label for="nombre">Nombre</label>
                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        required>
                </div>

                <div>
                    <label for="apellido_paterno">Apellido paterno</label>
                    <input
                        type="text"
                        id="apellido_paterno"
                        name="apellido_paterno"
                        required>
                </div>

                <div>
                    <label for="apellido_materno">Apellido materno</label>
                    <input
                        type="text"
                        id="apellido_materno"
                        name="apellido_materno">
                </div>

                <div>
                    <label for="email">Correo electrónico</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required>
                </div>

                <div>
                    <label for="nuevo_username">Usuario</label>
                    <input
                        type="text"
                        id="nuevo_username"
                        name="username"
                        required>
                </div>

                <div>
                    <label for="nueva_password">Contraseña</label>
                    <input
                        type="password"
                        id="nueva_password"
                        name="password"
                        required>
                </div>
            </div>

            <button type="submit" class="boton-formulario">
                Registrar cuenta
            </button>
        </form>

        <p class="texto-centro">
            ¿Ya tienes una cuenta?
            <a href="{% url 'home:login' %}">Inicia sesión</a>
        </p>
    </div>
</section>
{% endblock %}
