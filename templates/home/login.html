{% extends "partials/base.html" %}

{% block title %}Iniciar sesión | CANACO Tabasco{% endblock %}

{% block content %}
<section class="seccion formulario-seccion">
    <div class="tarjeta-formulario">
        <span class="subtitulo">Acceso de usuarios</span>
        <h1>Iniciar sesión</h1>

        <p>Ingresa tus datos para acceder al portal.</p>

        <form class="formulario" method="post">
            {% csrf_token %}

            <label for="username">Usuario</label>
            <input
                type="text"
                id="username"
                name="username"
                placeholder="Escribe tu usuario"
                required>

            <label for="password">Contraseña</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Escribe tu contraseña"
                required>

            <button type="submit" class="boton-formulario">
                Iniciar sesión
            </button>
        </form>

        <p class="texto-centro">
            ¿No tienes una cuenta?
            <a href="{% url 'home:registro' %}">Regístrate aquí</a>
        </p>
    </div>
</section>
{% endblock %}
